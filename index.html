
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d0b">
  <title>KEY CENTER</title>

  <style>
    :root {
      --bg: #080d0b;
      --card: #111915;
      --green: #39f58a;
      --text: #f2fff6;
      --muted: #8d9b92;
      --border: #26382e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at top, #153725 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border: 1px solid #39f58a70;
      border-radius: 17px;
      background: #39f58a12;
      color: var(--green);
      font-size: 27px;
      font-weight: 900;
      box-shadow: 0 0 35px #39f58a12;
    }

    h1 {
      font-size: 29px;
      letter-spacing: 3px;
      font-weight: 900;
    }

    h1 span {
      color: var(--green);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      padding: 22px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(145deg, #131d17, #0d130f);
      box-shadow: 0 12px 35px #00000020;
    }

    .card-title {
      margin-bottom: 7px;
      font-size: 17px;
      font-weight: 800;
    }

    .description {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      border: 0;
      border-radius: 11px;
      background: var(--green);
      color: #06120a;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    .key-result {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border: 1px dashed #39f58a70;
      border-radius: 11px;
      background: #39f58a09;
    }

    .small-label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .key-value {
      overflow-wrap: anywhere;
      color: var(--green);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .copy-btn {
      margin-top: 12px;
      min-height: 38px;
      border: 1px solid var(--border);
      background: #1b2820;
      color: var(--text);
    }

    input {
      width: 100%;
      height: 46px;
      margin-bottom: 12px;
      padding: 0 13px;
      outline: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #090e0b;
      color: var(--text);
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px #39f58a12;
    }

    input::placeholder {
      color: #66736a;
    }

    .status {
      display: none;
      margin-top: 13px;
      padding: 11px 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .status.success {
      display: block;
      color: var(--green);
      background: #39f58a10;
      border: 1px solid #39f58a35;
    }

    .status.error {
      display: block;
      color: #ff9a9a;
      background: #ff555510;
      border: 1px solid #ff555535;
    }

    .content-result {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #080d0b;
      border: 1px solid var(--border);
    }

    .content-result h3 {
      margin-bottom: 10px;
      color: var(--green);
      font-size: 15px;
    }

    .content-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #d8e4dc;
      font-size: 13px;
      line-height: 1.7;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      color: #657168;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (max-width: 360px) {
      .card {
        padding: 17px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="logo">K</div>
      <h1>KEY <span>CENTER</span></h1>
      <p class="subtitle">Key của bạn, nội dung của bạn.</p>
    </header>

    <!-- KHU VỰC LẤY KEY -->
    <section class="card">
      <h2 class="card-title">01. Lấy Key</h2>
      <p class="description">Nhận key riêng của bạn chỉ với một lần nhấn.</p>

      <button id="getKeyButton" type="button">LẤY KEY NGAY</button>

      <div class="key-result" id="keyResult">
        <div class="small-label">KEY CỦA BẠN</div>
        <div class="key-value" id="keyValue"></div>
        <button class="copy-btn" id="copyButton" type="button">
          Sao chép Key
        </button>
      </div>

      <div class="status" id="getStatus" role="status"></div>
    </section>

    <!-- KHU VỰC NHẬP KEY -->
    <section class="card">
      <h2 class="card-title">02. Nhập Key</h2>
      <p class="description">Nhập key để xác nhận và xem nội dung.</p>

      <form id="validateForm">
        <input
          id="keyInput"
          type="text"
          placeholder="Nhập key của bạn..."
          maxlength="200"
          autocomplete="off"
          required
        >
        <button id="validateButton" type="submit">
          XÁC NHẬN KEY
        </button>
      </form>

      <div class="status" id="validateStatus" role="status"></div>

      <div class="content-result" id="contentResult">
        <h3 id="contentTitle"></h3>
        <div class="content-text" id="contentText"></div>
      </div>
    </section>

    <footer>KEY CENTER · SECURE ACCESS</footer>
  </main>

  <script>
    // ===== CẤU HÌNH SUPABASE =====
    const SUPABASE_URL =
      "https://wxygtmfttyidwnhjdwdw.supabase.co";

    // Thay bằng Supabase anon/public key hiện tại của bạn.
    const SUPABASE_ANON_KEY = "DAN_ANON_KEY_CUA_BAN_VAO_DAY";

    const FUNCTION_URL =
      SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/";

    // Mỗi hồ sơ trình duyệt giữ một client ID riêng.
    function getClientId() {
      const storageKey = "key_center_client_id_v1";
      let clientId = localStorage.getItem(storageKey);

      if (!clientId) {
        clientId = crypto.randomUUID
          ? crypto.randomUUID()
          : "kc-" + Date.now() + "-" +
            Math.random().toString(36).slice(2) +
            Math.random().toString(36).slice(2);

        localStorage.setItem(storageKey, clientId);
      }

      return clientId;
    }

    const $ = (id) => document.getElementById(id);

    function setStatus(id, message, type) {
      const el = $(id);
      el.textContent = message;
      el.className = "status " + type;
    }

    function clearStatus(id) {
      const el = $(id);
      el.textContent = "";
      el.className = "status";
    }

    async function callFunction(name, payload) {
      if (
        !SUPABASE_ANON_KEY ||
        SUPABASE_ANON_KEY === "DAN_ANON_KEY_CUA_BAN_VAO_DAY"
      ) {
        throw new Error("Bạn chưa cấu hình Supabase anon key.");
      }

      const response = await fetch(FUNCTION_URL + name, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify(payload)
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error("Máy chủ trả về dữ liệu không hợp lệ.");
      }

      if (!response.ok) {
        throw new Error(
          data.error || "Yêu cầu thất bại. Vui lòng thử lại."
        );
      }

      return data;
    }

    // ===== LẤY KEY =====
    $("getKeyButton").addEventListener("click", async () => {
      const button = $("getKeyButton");

      button.disabled = true;
      button.textContent = "ĐANG XỬ LÝ...";
      clearStatus("getStatus");

      try {
        const data = await callFunction("get-key", {
          clientId: getClientId()
        });

        if (!data.success || !data.key) {
          throw new Error(
            data.message ||
            data.error ||
            "Không thể cấp key. Có thể đã hết nội dung."
          );
        }

        $("keyValue").textContent = data.key;
        $("keyInput").value = data.key;
        $("keyResult").style.display = "block";

        setStatus("getStatus", "Lấy key thành công!", "success");
      } catch (error) {
        setStatus(
          "getStatus",
          error.message || "Có lỗi xảy ra. Vui lòng thử lại.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "LẤY KEY NGAY";
      }
    });

    // ===== SAO CHÉP KEY =====
    $("copyButton").addEventListener("click", async () => {
      const key = $("keyValue").textContent;

      try {
        await navigator.clipboard.writeText(key);
        $("copyButton").textContent = "Đã sao chép!";
      } catch {
        $("keyInput").value = key;
        $("keyInput").focus();
        $("keyInput").select();
        setStatus(
          "getStatus",
          "Hãy sao chép key đang được chọn.",
          "success"
        );
      }

      setTimeout(() => {
        $("copyButton").textContent = "Sao chép Key";
      }, 1600);
    });

    // ===== XÁC NHẬN KEY =====
    $("validateForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const button = $("validateButton");
      const key = $("keyInput").value.trim();

      if (!key) {
        setStatus("validateStatus", "Vui lòng nhập key.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "ĐANG KIỂM TRA...";
      clearStatus("validateStatus");
      $("contentResult").style.display = "none";

      try {
        const data = await callFunction("validate-key", {
          clientId: getClientId(),
          key: key
        });

        if (!data.success || !data.valid) {
          throw new Error(
            data.error || data.message || "Key không hợp lệ."
          );
        }

        $("contentTitle").textContent =
          data.title || "Nội dung của bạn";

        $("contentText").textContent =
          data.content || "Nội dung hiện chưa có.";

        $("contentResult").style.display = "block";

        setStatus(
          "validateStatus",
          "Key hợp lệ. Xác nhận thành công!",
          "success"
        );
      } catch (error) {
        setStatus(
          "validateStatus",
          error.message || "Không thể xác nhận key.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "XÁC NHẬN KEY";
      }
    });
  </script>
</body>
</html>
