
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d0b">
  <title>KEY CENTER</title>

  <style>
    :root {
      --bg: #080d0b;
      --card: #111914;
      --green: #39f58a;
      --text: #f2fff6;
      --muted: #91a096;
      --border: #28392f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top, #163b27 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 13px;
      display: grid;
      place-items: center;
      border: 1px solid #39f58a70;
      border-radius: 15px;
      color: var(--green);
      background: #39f58a12;
      font-size: 27px;
      font-weight: 900;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 3px;
    }

    h1 span {
      color: var(--green);
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      padding: 21px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: linear-gradient(145deg, #131d17, #0c120e);
      box-shadow: 0 12px 35px #0003;
    }

    .card h2 {
      margin-bottom: 7px;
      font-size: 17px;
    }

    .description {
      margin-bottom: 17px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #06120a;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    input {
      width: 100%;
      height: 46px;
      margin-bottom: 12px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #090e0b;
      color: var(--text);
      font-size: 14px;
    }

    input:focus {
      border-color: var(--green);
    }

    input::placeholder {
      color: #77847a;
    }

    .key-box,
    .content-box {
      display: none;
      margin-top: 14px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #080d0b;
    }

    .key-label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .key-value {
      color: var(--green);
      font-size: 16px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .copy-button {
      margin-top: 12px;
      border: 1px solid var(--border);
      background: #1a2820;
      color: var(--text);
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 11px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .status.success {
      display: block;
      border: 1px solid #39f58a40;
      background: #39f58a0d;
      color: var(--green);
    }

    .status.error {
      display: block;
      border: 1px solid #ff656540;
      background: #ff65650d;
      color: #ff9999;
    }

    .content-box h3 {
      margin-bottom: 9px;
      color: var(--green);
      font-size: 15px;
    }

    .content-text {
      color: #dbe6de;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 20px;
      color: #68766c;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="logo">K</div>
      <h1>KEY <span>CENTER</span></h1>
      <p class="subtitle">Your key. Your content.</p>
    </header>

    <section class="card">
      <h2>01. Lấy Key</h2>
      <p class="description">Nhận key riêng của bạn.</p>

      <button id="getKeyButton" type="button">
        LẤY KEY NGAY
      </button>

      <div id="keyBox" class="key-box">
        <div class="key-label">KEY CỦA BẠN</div>
        <div id="keyValue" class="key-value"></div>
        <button id="copyButton" class="copy-button" type="button">
          Sao chép Key
        </button>
      </div>

      <div id="getStatus" class="status" role="status"></div>
    </section>

    <section class="card">
      <h2>02. Nhập Key</h2>
      <p class="description">Xác nhận key để xem nội dung.</p>

      <form id="validateForm">
        <input
          id="keyInput"
          type="text"
          maxlength="200"
          placeholder="Nhập key của bạn..."
          autocomplete="off"
          required
        >
        <button id="validateButton" type="submit">
          XÁC NHẬN KEY
        </button>
      </form>

      <div id="validateStatus" class="status" role="status"></div>

      <div id="contentBox" class="content-box">
        <h3 id="contentTitle"></h3>
        <div id="contentText" class="content-text"></div>
      </div>
    </section>

    <footer>KEY CENTER</footer>
  </main>

  <script>
    // ===== SUPABASE CONFIGURATION =====
    const SUPABASE_URL =
      "https://wxygtmfttyidwnhjdwdw.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_ax3nIoOvnP1E0qafE_e7kg_2hA3ATbT";

    const FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/";

    // Mỗi hồ sơ trình duyệt giữ client ID riêng.
    function getClientId() {
      const storageKey = "key_center_client_id_v1";
      let id = localStorage.getItem(storageKey);

      if (!id) {
        id = crypto.randomUUID
          ? crypto.randomUUID()
          : "kc-" + Date.now() + "-" +
            Math.random().toString(36).slice(2) +
            Math.random().toString(36).slice(2);

        localStorage.setItem(storageKey, id);
      }

      return id;
    }

    const $ = id => document.getElementById(id);

    function showStatus(id, message, type) {
      const el = $(id);
      el.textContent = message;
      el.className = "status " + type;
    }

    function clearStatus(id) {
      $(id).textContent = "";
      $(id).className = "status";
    }

    async function callFunction(name, payload) {
      const response = await fetch(FUNCTION_URL + name, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify(payload)
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "Máy chủ trả về dữ liệu không hợp lệ (HTTP " +
          response.status + ")."
        );
      }

      if (!response.ok) {
        console.error("Function error:", response.status, data);

        throw new Error(
          "HTTP " + response.status + ": " +
          (data.message || data.error ||
           JSON.stringify(data))
        );
      }

      return data;
    }

    // ===== GET KEY =====
    $("getKeyButton").addEventListener("click", async () => {
      const button = $("getKeyButton");

      button.disabled = true;
      button.textContent = "ĐANG XỬ LÝ...";
      clearStatus("getStatus");

      try {
        const data = await callFunction("get-key", {
          clientId: getClientId()
        });

        if (!data.success || !data.key) {
          throw new Error(
            data.message || data.error ||
            "Không còn nội dung để cấp."
          );
        }

        $("keyValue").textContent = data.key;
        $("keyInput").value = data.key;
        $("keyBox").style.display = "block";

        showStatus("getStatus", "Lấy key thành công!", "success");
      } catch (error) {
        showStatus(
          "getStatus",
          error.message || "Có lỗi xảy ra.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "LẤY KEY NGAY";
      }
    });

    // ===== COPY KEY =====
    $("copyButton").addEventListener("click", async () => {
      const key = $("keyValue").textContent;

      try {
        await navigator.clipboard.writeText(key);
        $("copyButton").textContent = "Đã sao chép!";
      } catch {
        $("keyInput").value = key;
        $("keyInput").focus();
        $("keyInput").select();

        showStatus(
          "getStatus",
          "Hãy sao chép key đang được chọn.",
          "success"
        );
      }

      setTimeout(() => {
        $("copyButton").textContent = "Sao chép Key";
      }, 1500);
    });

    // ===== VALIDATE KEY =====
    $("validateForm").addEventListener("submit", async event => {
      event.preventDefault();

      const button = $("validateButton");
      const key = $("keyInput").value.trim();

      if (!key) {
        showStatus("validateStatus", "Vui lòng nhập key.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "ĐANG KIỂM TRA...";
      clearStatus("validateStatus");
      $("contentBox").style.display = "none";

      try {
        const data = await callFunction("validate-key", {
          clientId: getClientId(),
          key: key
        });

        if (!data.success || !data.valid) {
          throw new Error(
            data.message || data.error || "Key không hợp lệ."
          );
        }

        $("contentTitle").textContent =
          data.title || "Nội dung của bạn";

        $("contentText").textContent =
          data.content || "Nội dung hiện chưa có.";

        $("contentBox").style.display = "block";

        showStatus(
          "validateStatus",
          "Xác nhận thành công!",
          "success"
        );
      } catch (error) {
        showStatus(
          "validateStatus",
          error.message || "Không thể xác nhận key.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "XÁC NHẬN KEY";
      }
    });
  </script>
</body>
</html>
